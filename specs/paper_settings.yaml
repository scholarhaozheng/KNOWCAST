# Paper-derived documentation, NOT an executable training configuration.
# null means unresolved from the cited paper; it must not become a default.
schema_version: "1.0"
status: paper_aligned_non_executable_specification
original_experiment_source_code: false
reproduction_status: not_reproduced
source:
  title: "KNOWCAST: Domain-knowledge-integrated deep learning for metro OD forecasting and path flow estimation"
  doi: "10.1016/j.trc.2026.105710"
  local_pdf: "docs/assets/knowcast-paper.pdf"
  page_numbering: "1-based PDF pages (37 pages)"
  numerical_precision_policy: "Continuous selected values and reported results are reported_rounded, not recovered full-precision experiment parameters."

dataset:
  source: "Section 5.1.1, pp. 20-21; Table 2, p. 22"
  name: City_S_Metro
  stations: 154
  transfer_stations: 17
  time_interval_minutes: 15
  raw_od_shape: [154, 154]
  raw_od_entries_including_diagonal: 23716
  lines: ["1", "2", "3", "4", "4 branch", "5"]
  train_dates_inclusive: ["2023-03-01", "2023-03-31"]
  validation_dates_inclusive: ["2023-05-01", "2023-05-10"]
  test_dates_inclusive: ["2023-05-11", "2023-05-20"]
  excluded_gap_dates_inclusive: ["2023-04-01", "2023-04-30"]
  dimension_retention_ratio:
    value: 0.23
    status: fixed_paper_reported
    interpretation: "Matrix-dimension ratio, not fraction of passenger volume retained."
  retained_destinations_per_origin: null # Exact integer cannot be recovered safely from the rounded ratio.
  compressed_destination_columns: null # Includes one residual column; do not infer an integer by rounding 154 * 0.23.
  selection_mapping_fit_period: training_only
  selection_mapping_frozen_across_splits: true
  residual_flow_preserved_in_origin_totals: true
  split_boundary_window_policy: null # Exact treatment of lookback windows at split boundaries is not supplied.
  historical_reference_gap_policy: null # April is excluded from train/evaluation; permitted context for May references is unspecified.
  data_availability: on_request

main_task:
  lookback_intervals: null # Section 5.6 gives sensitivity examples, not an unambiguous main-run setting.
  forecast_intervals: null
  batch_size: null
  full_training_epochs: null
  random_seed: null
  optimizer: null
  optimizer_parameters: null
  learning_rate_schedule: null
  early_stopping_patience: null
  missing_value_policy: null
  output_nonnegativity_policy: null # Do not silently import clipping behavior from historical code.
  decoder_zero_input_scale_convention: null # Zero matrix is disclosed; treatment relative to normalization is not.

hyperparameter_search:
  source: "Table 2 and Section 5.1.4, p. 22"
  framework: Optuna
  sampler: TPE
  pruner: MedianPruner
  storage: SQLite
  objective: minimize_validation_mae
  trials_reported: 80
  maximum_epochs_per_trial: 40
  best_trial_label_reported: 78
  sampler_parameters: null
  pruner_parameters: null
  pruning_report_schedule: null
  trial_seed_policy: null
  original_study_database: null
  space:
    alpha_decay:
      distribution: categorical
      choices: [0.01, 0.05, 0.1, 0.2, 0.5]
    base_learning_rate:
      distribution: log_uniform
      low: 0.00001
      high: 0.01
    dropout_probability:
      distribution: uniform
      low: 0.0
      high: 0.5
    rnn_hidden_units:
      distribution: categorical
      choices: [64, 96, 128, 192]
    gat_feature_dimension:
      distribution: categorical
      choices: [256, 512, 768]
    initial_generation_loss_weight:
      distribution: log_uniform
      low: 0.00001
      high: 0.1
    additional_distribution_dimension:
      distribution: categorical
      choices: [2, 3, 4, 5]
    additional_section_feature_dimension:
      distribution: categorical
      choices: [5, 6, 7, 8]
  selected_values:
    precision: reported_rounded
    alpha_decay: 0.1
    base_learning_rate: 0.00653
    dropout_probability: 0.442
    rnn_hidden_units: 96
    gat_feature_dimension: 256
    initial_generation_loss_weight: 0.0264
    additional_distribution_dimension: 5
    additional_section_feature_dimension: 6

knowledge_and_training:
  source: "Sections 4.3-4.6, pp. 13-18; Section 5.1.4, p. 22"
  reconstruction_fit_protocol:
    status: prescribed_for_future_implementation_not_verified_original_execution
    fit_split: training_only
    components: [generation_estimators, gravity_zeta, autoencoders, scalers, destination_mappings, residual_shares]
    validation_and_test: frozen_parameters_forward_only
    validation_role: configuration_and_checkpoint_selection_only
    dynamic_ipf_and_features: permitted_from_admissible_inputs_without_fitted_parameter_updates
  trip_generation_model: independently_pretrained_DCRNN
  generation_covariates:
    source: "Equation (14), pp. 13-14; Case 2c, Section 5.3.1, pp. 27-29"
    full: [PopAct, AgePct_work, EduPct, HHSize, Wknd, TOD, Season, Event]
    temporal_only: [Wknd, TOD, Season, Event]
    time_of_day: "hours since local calendar midnight in [0,24), not elapsed service-day hours"
    population_catchment_meters: 800
    event_scope_meters: 1000
    event_score_range: [0, 1]
    event_weights: null
    software_profile_field: "cfg.domain_knowledge.generation_covariates"
    software_profile_status: explicit_reconstruction_interface
  trip_generation_pretraining_hyperparameters: null
  trip_generation_main_training_freezing_policy: null # Not fully specified by the paper; evaluation always uses frozen parameters.
  gravity_deterrence:
    function: "exp(-zeta * impedance)"
    zeta: null
    calibration: offline_historical_data
    frozen_during_main_training: true
    dynamic_balancing: IPF_at_each_time_step
    ipf_tolerance_and_iteration_limit: null
  autoencoders:
    features: [trip_distribution, section_probability, line_departure_frequency]
    phase_1: independent_reconstruction_pretraining
    reconstruction_objective: mean_squared_error
    phase_2: joint_encoder_fine_tuning_with_forecasting_model
    architectures_and_pretraining_schedule: null
    section_probability_pretraining_protocol: initialize_and_record_utility_coefficients_before_generating_training_matrices
    original_section_probability_pretraining_coefficients: null # Record future implementation provenance; original artifact not recovered.
  utility_initialization:
    precision: reported_rounded
    per_station: -0.30
    per_transfer: -0.573
    coefficients_trainable_in_full_model: true
    softmax_has_trainable_parameters: false
  loss:
    source: "Eqs. (15)-(19), pp. 14-15"
    od: mean_absolute_error_in_original_flow_scale
    generation: sum_of_squared_station_production_and_attraction_residuals
    attraction_totals: retained_destination_mapping_plus_training_period_residual_allocation
    zero_residual_allocation_denominator: uniform_over_non_retained_destinations
    auxiliary_weight: "initial_weight * max(1 - alpha_decay * epsilon, 0)"
    epoch_origin_for_formula: null # The training-loop epoch-index convention is unresolved.
    selected_weight_zero_condition: "epsilon >= 10"
    illustrative_formula_values:
      interpretation: formula_indices_not_recovered_training_loop_epoch_numbers
      epsilon_0_weight_multiplier: 1.0
      epsilon_9_weight_multiplier: 0.1
      epsilon_10_weight_multiplier: 0.0
    minibatch_estimator: null # Must be declared for the full Eq. (16) sum and full Eq. (18) mean objectives.
    minibatch_sampling_and_example_multiplicity: null
    minibatch_normalization_and_accumulation: null # Paper's sum must not silently become mean(abs(error)) or abs(mean(error)).
  checkpoint_selection: lowest_validation_mae
  checkpoint_tie_breaking: null
  test_used_for_tuning_or_selection: false
  test_curves_in_paper: post_hoc_diagnostics_only

evaluation:
  source: "Eqs. (34)-(37), p. 22; Section 5.2, p. 24"
  prediction_mode: autoregressive_without_future_od_labels
  primary_metrics: [MAE, RMSE, WMAPE]
  flow_scale: original
  aggregation_order: per_forecast_horizon_then_arithmetic_mean_over_horizons
  wmape_formula: "100 * sum(abs(prediction - truth)) / sum(truth)"
  wmape_zero_denominator_policy: null
  segmented_metric: SMAPE
  smape_formula: "100 * mean(abs(prediction - truth) / ((abs(truth) + abs(prediction)) / 2 + epsilon))"
  smape_epsilon: 0.000001
  segmented_analysis:
    source: "Section 5.2 and Figure 11, pp. 25 and 27"
    ranking: descending_OD_passenger_flow
    group_flow_shares: {head: 0.30, body: 0.50, tail: 0.20}
    cumulative_thresholds: [0.30, 0.80, 1.00]
    reported_OD_pair_shares: {head: 0.062, body: 0.375, tail: 0.563}
    OD_pair_share_status: observed_paper_result_not_partition_parameters
    grouping_reference_period: null
    threshold_crossing_and_tie_policy: null
    horizon_overlap_counting_policy: null
    zero_truth_diagnostics: [instance_count, mean_prediction, maximum_absolute_prediction]
  main_result_paper_reported:
    source: "Table 3, p. 23"
    precision: reported_rounded
    reproduced_here: false
    mae: 1.02
    rmse: 3.04
    wmape_percent: 54.25
  baseline_model_count_reported: 10
  baselines_and_ablations_status: paper_reported_not_reproduced
  original_checkpoints_predictions_and_run_manifests: null

indirect_operational_assessment:
  source: "Section 5.5 and Table 8, pp. 32-33"
  direct_path_labels_available: false
  direct_continuous_section_flow_validation: false
  assignment_scope: explicitly_retained_real_od_pairs_only
  residual_destination_assigned_a_path: false
  observed_unit: designated_carriage_in_a_selected_train
  comparison_unit: estimated_train_load
  sampling_days: 10
  sampling_includes_weekends: true
  sampling_dates: null
  daily_time_slices: ["07:15", "08:00", "08:45", "09:30", "10:15", "11:00", "16:30", "17:15", "18:00", "18:45", "19:30", "20:15", "21:00", "22:30"]
  carriage_to_train_expansion: calibrated_for_same_corridor_and_service_period
  carriage_expansion_factors_and_calibration_data: null
  model_alignment_steps:
    - dynamic_scale_compensation_for_non_retained_destinations
    - gaussian_temporal_dispersion_with_delay_and_spread_parameterized_by_hop_distance
    - dynamic_headway_ratio_conversion_from_section_volume_to_train_load
  compensation_formula_and_parameters: null
  gaussian_delay_spread_and_boundary_rules: null
  headway_ratio_formula_and_series: null
  calibration_evaluation_separation: null
  uncertainty: residual_inter_carriage_imbalance_and_postprocessing_assumptions
  comparison_metrics: [WMAPE, Pearson_r]
  interpretation: indirect_operational_plausibility_only

future_implementation_checks:
  status: required_not_run
  checks:
    - resolve_and_record_null_settings_before_claiming_reproduction
    - fit_all_auxiliaries_gravity_encoders_scalers_mappings_and_shares_on_training_only
    - verify_frozen_validation_and_test_forward_computations
    - validate_split_and_prediction_origin_information_boundaries
    - verify_nonzero_generation_loss_gradient_to_forecast_parameters
    - verify_squared_error_and_destination_reconstruction_against_hand_examples
    - declare_and_verify_minibatch_sampling_scaling_and_accumulation_against_full_objectives
    - verify_formula_at_epsilon_0_9_10_and_declare_epoch_index_convention
    - record_utility_initialization_before_section_probability_pretraining_matrix_generation
    - verify_pretrained_encoders_are_registered_and_updated_by_forecasting_loss
    - verify_pruner_receives_intermediate_validation_metrics_and_can_stop_trials
    - verify_checkpoint_selection_cannot_access_test_scores
    - verify_metric_definitions_and_horizon_aggregation_with_hand_examples
    - verify_retained_od_path_flow_conservation_and_residual_exclusion
    - validate_load_alignment_units_calibration_provenance_and_uncertainty
    - archive_exact_config_environment_seed_split_checkpoint_and_predictions
